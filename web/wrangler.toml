# Конфигурация Cloudflare Worker: сайт + API.
# Перед первым деплоем замените database_id (см. docs/03-cloudflare.md).

name = "video-archive"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# API и медиа обрабатывает Worker, всё остальное отдаётся как статика.
run_worker_first = ["/api/*", "/media/*"]

[[d1_databases]]
binding = "DB"
database_name = "video-archive"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PREVIEWS"
bucket_name = "video-archive-previews"

[ai]
binding = "AI"
remote = true

[vars]
# Модель Workers AI для ИИ-тегов по умолчанию (vision, без принятия лицензии). Загрузчик может передать другую (только @cf/...).
AI_MODEL = "@cf/mistralai/mistral-small-3.1-24b-instruct"
# Максимальный размер превью/постера, загружаемого через PUT /api/media (байты).
MEDIA_MAX_BYTES = "8388608"

[observability]
enabled = true
