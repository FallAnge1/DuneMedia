# Проверки при каждом push и pull request: тесты сайта/API и программы-загрузчика.
name: Проверки

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  web:
    name: Сайт и API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  uploader:
    name: Загрузчик
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uploader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uploader/requirements-dev.txt
      - name: ffmpeg и библиотеки для Qt
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
